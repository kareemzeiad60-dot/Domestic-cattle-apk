name: Build Android APK from ZIP

on:
  push:
    branches:
      - main # غيّره إلى master إذا كان فرعك الرئيسي اسمه master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط الملف والبحث الذكي عن مجلد Flutter الرئيسي
      - name: Extract Project ZIP and Locate Root
        run: |
          echo "Unzipping cattle-ai-mobile-ready-to-build.zip..."
          unzip -q cattle-ai-mobile-ready-to-build.zip -d temp_extracted
          
          # البحث عن مكان وجود pubspec.yaml أينما كان
          PUBSPEC_PATH=$(find temp_extracted -name "pubspec.yaml" -print -quit)
          
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: Could not find pubspec.yaml inside the zip file!"
            exit 1
          fi
          
          # تحديد المجلد الذي يحتوي على pubspec.yaml
          FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found Flutter root at: $FLUTTER_DIR"
          
          # نقل كل محتويات مجلد المشروع إلى المسار الرئيسي
          cp -r "$FLUTTER_DIR"/* .
          # نقل الملفات المخفية (إن وجدت مثل .dotfiles)
          cp -r "$FLUTTER_DIR"/.[!.]* . 2>/dev/null || true
          
          # تنظيف المجلد المؤقت
          rm -rf temp_extracted

      # 3. إعداد Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. تثبيت حزم ومكتبات المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # 7. رفع الـ APK ليصبح جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cattle-ai-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
