name: Build Expo Android APK from ZIP

on:
  push:
    branches:
      - main # غيّرها إلى master إذا كان اسم الفرع master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط ملف الـ ZIP واستخراج مشروع Expo
      - name: Extract ZIP and Locate Expo Project
        run: |
          echo "Unzipping cattle-ai-mobile-ready-to-build.zip..."
          unzip -q cattle-ai-mobile-ready-to-build.zip -d temp_extracted
          
          # البحث عن ملف package.json
          PACKAGE_PATH=$(find temp_extracted -name "package.json" -not -path "*/node_modules/*" -print -quit)
          
          if [ -z "$PACKAGE_PATH" ]; then
            echo "ERROR: Could not find package.json inside the zip file!"
            exit 1
          fi
          
          EXPO_DIR=$(dirname "$PACKAGE_PATH")
          echo "Found Expo root at: $EXPO_DIR"
          
          # نقل كافة الملفات إلى المسار الرئيسي
          cp -r "$EXPO_DIR"/* .
          cp -r "$EXPO_DIR"/.[!.]* . 2>/dev/null || true
          rm -rf temp_extracted

      # 3. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 4. إعداد بيئة Java
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 5. إعداد بيئة Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. تثبيت مكتبات المشروع (NPM Dependencies)
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 7. تثبيت أداة EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 8. توليد مجلد Android وتجميع ملف الـ APK
      - name: Build Android APK
        run: |
          npx expo prebuild --platform android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # 9. رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cattle-ai-app-release
          path: android/app/build/outputs/apk/release/app-release.apk
