name: Build Android APK from ZIP

on:
  push:
    branches:
      - main # إذا كان اسم الفرع لديك master غيّره هنا إلى master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط الملف الخاص بك ونقل المحتويات للمسار الرئيسي
      - name: Extract Project ZIP
        run: |
          echo "Extracting cattle-ai-mobile-ready-to-build.zip..."
          unzip -q cattle-ai-mobile-ready-to-build.zip -d extracted_app
          
          # نقل كل محتويات المجلد المفكوك إلى المسار الرئيسي
          cp -r extracted_app/*/. . 2>/dev/null || cp -r extracted_app/. . 2>/dev/null
          rm -rf extracted_app

      # 3. إعداد بيئة Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. تثبيت حزم ومكتبات المشروع
      - name: Install dependencies
        run: flutter pub get

      # 6. بناء ملف الـ APK
      - name: Build APK
        run: flutter build apk --release

      # 7. رفع الـ APK ليصبح جاهزاً للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cattle-ai-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
